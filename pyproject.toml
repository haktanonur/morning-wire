[project]
name = "daily-brief-bot"
version = "0.1.0"
description = "Fetches market, portfolio, news, and sports data, summarizes it with Claude, and (Phase 1) prints it to the terminal."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "yfinance>=0.2.40",
    "feedparser>=6.0.11",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Added in Phase 2+: "twilio>=9.0", "boto3>=1.34"
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
